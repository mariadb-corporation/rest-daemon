# Sample configuration of mariadb-mrsd (installed as mariadb-mrsd.conf.sample).
#
# "mariadb-mrsd --setup <user>@<host>:<port> -d <directory>" writes a complete
# configuration, keyring and TLS certificate; see README.md. To write one by
# hand, store the account password and the JWT secret in the keyring first:
#
#   mariadb-mrsd-keyring init <keyring> --master-key-file=<master key file>
#   mariadb-mrsd-keyring set <keyring> <mysql_user> password '<password>' \
#     --master-key-file=<master key file>
#   mariadb-mrsd-keyring set <keyring> rest-user jwt_secret '<secret>' \
#     --master-key-file=<master key file>

[DEFAULT]
# defaults: see "mariadb-mrsd --help"
#logging_folder=
#runtime_folder=
#data_folder=
keyring_path=<keyring>
master_key_path=<master key file>

[logger]
level=info

[http_server]
port=8443
ssl=1
ssl_cert=<certificate file>
ssl_key=<key file>

[mysql_rest_service]
# MySQL server(s): host[:port], [ipv6]:port or local:/path/to/socket,
# comma-separated
mysql_read_write_destinations=<host>:3306
#mysql_read_only_destinations=
# account with the mysql_rest_service_meta_provider and
# mysql_rest_service_data_provider roles; password in the keyring
mysql_user=<mysql_user>
# id of this instance in mysql_rest_service_metadata.router
router_id=1
