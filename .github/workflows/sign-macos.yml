name: Sign macOS Packages

# Signs and notarizes macOS package tarballs that an earlier job of the calling
# run uploaded, and puts the signed tarballs back under the same artifact names.
#
# A separate job, rather than steps in the build legs, so that the signing
# certificate and the notary key reach one job and never the build machines.
# It also has to come after cpack: the install step rewrites load commands with
# install_name_tool, which would invalidate any earlier signature. The work
# itself is tools/release/sign_macos_package.sh, which runs the same way on a
# Mac. Taken from MariaDB Shell's sign-macos.yml; only the paths, the build
# workflow's name and the entitlements (packaging/macos) differ.
#
# The artifacts are overwritten in place, so whatever reads them later -- Verify
# Packages, which starts once the whole run has finished, and Publish Release --
# sees only the signed tarballs and needs no change. A run whose signing failed
# fails as a whole, so it can never be published by mistake.
#
# A run that signed leaves a marker artifact, macos-signed-<Team ID>. Verify
# Packages looks for it and then requires valid signatures from that team.

on:
  workflow_call:
    inputs:
      artifacts:
        description: >-
          JSON list of artifact names in the calling run, each holding macOS
          .tar.gz packages, e.g. '["pkg-macos-x64", "pkg-macos-arm64"]'
        type: string
        required: true
  # TEMPORARY, to try signing on the packages of a finished build run without
  # rebuilding. The signed tarballs and the marker land in THIS run, not in the
  # build run, so Verify Packages and Publish Release do not see them: check
  # them by hand (gh run download <this run>, then verify_package.sh with
  # EXPECT_TEAM_ID). Remove once a chained sign=true release run has passed.
  # Must be started on release/candidate (release-build's branch policy), so
  # this file has to be on that branch.
  workflow_dispatch:
    inputs:
      # Never empty when dispatched, which is how the job tells a dispatch from
      # a workflow_call: there github.event_name is the caller's event, which is
      # workflow_dispatch too.
      run_id:
        description: "Rest-Daemon-Release run whose macOS packages to sign (latest = the newest finished one that has them)"
        type: string
        default: latest
      artifacts:
        description: "JSON list of artifact names in that run"
        type: string
        default: '["pkg-macos-x64", "pkg-macos-arm64"]'

jobs:
  sign:
    name: Sign (${{ matrix.artifact }})
    runs-on: macos-latest
    # The signing secrets are environment secrets of release-build. A reusable
    # workflow needs both halves to see them: this job names the environment,
    # and the caller passes secrets: inherit (without it the secrets context
    # here is empty, environment secrets included). The environment's required
    # reviewers therefore approve this job too, once the builds have finished.
    environment: release-build

    strategy:
      # Both packages are signed and notarized in parallel, and a failure in one
      # still lets the other report, so a single run shows every problem.
      fail-fast: false
      matrix:
        artifact: ${{ fromJSON(inputs.artifacts) }}

    permissions:
      contents: read   # checkout
      actions: read    # download from another run (workflow_dispatch only)

    steps:
      - name: Checkout Signing Script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/release/sign_macos_package.sh
            packaging/macos
          sparse-checkout-cone-mode: false

      # Dispatched only. "latest" is the newest finished Rest-Daemon-Release
      # run, failed ones included (a run whose signing failed still has its
      # packages), that still holds every requested artifact.
      - name: Pick Build Run
        id: pick
        if: ${{ inputs.run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACTS: ${{ inputs.artifacts }}
        run: |
          set -euo pipefail
          has_all() {
            local have
            have=$(gh api --paginate "repos/$REPO/actions/runs/$1/artifacts" \
              --jq '.artifacts[] | select(.expired | not) | .name')
            for name in $(jq -r '.[]' <<< "$ARTIFACTS"); do
              grep -qxF "$name" <<< "$have" || return 1
            done
          }
          if [ "$RUN_ID" = latest ]; then
            CANDIDATES=$(gh run list -R "$REPO" --workflow rest-daemon-release.yml \
              --status completed --limit 20 --json databaseId --jq '.[].databaseId')
            RUN_ID=""
            for id in $CANDIDATES; do
              if has_all "$id"; then RUN_ID="$id"; break; fi
            done
            [ -n "$RUN_ID" ] || { echo "::error::No recent finished Rest-Daemon-Release run holds $ARTIFACTS"; exit 1; }
          elif ! has_all "$RUN_ID"; then
            echo "::error::Run $RUN_ID does not hold every one of $ARTIFACTS (wrong id, or expired)"
            exit 1
          fi
          echo "==> Signing the packages of $GITHUB_SERVER_URL/$REPO/actions/runs/$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Package
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: _in
          # Dispatched: the build run picked above. Called: no token, so the
          # action reads the current run as before.
          run-id: ${{ steps.pick.outputs.run_id || github.run_id }}
          github-token: ${{ steps.pick.outputs.run_id && github.token || '' }}

      # A keychain of its own, created for this job and deleted at the end: the
      # login keychain of a hosted runner is locked, and an identity left in a
      # shared one would outlive the job.
      - name: Import Signing Certificate
        id: keychain
        env:
          P12_BASE64: ${{ secrets.DEVTOOLS_APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVTOOLS_APPLE_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.DEVTOOLS_APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for v in P12_BASE64 P12_PASSWORD IDENTITY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty: the release-build environment's DEVTOOLS_APPLE_* secrets are missing"
              exit 1
            fi
          done

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No auto-lock for 6 hours, the longest a job can run.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # "MAC verification failed" here, with the right password, means the
          # .p12 was exported by OpenSSL 3 with its default AES-256 encryption.
          # Export it again with `openssl pkcs12 -export -legacy`.
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"

          # Lets codesign use the key without the UI prompt a runner cannot answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Prepend it to the search list, which codesign's --timestamp
          # certificate-chain lookup relies on.
          OLD=$(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN" $OLD

          # Fails here, not halfway through signing, when the .p12 holds only the
          # certificate without its private key, or another certificate.
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -qF "\"$IDENTITY\""; then
            echo "::error::No valid signing identity '$IDENTITY' in the imported .p12 (a certificate without its private key?)"
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi

          # The Team ID is the parenthesised end of a Developer ID identity.
          TEAM_ID=$(printf '%s' "$IDENTITY" | sed -n 's/.*(\([A-Z0-9]\{10\}\))$/\1/p')
          if [ -z "$TEAM_ID" ]; then
            echo "::error::Cannot read a Team ID from the signing identity; expected 'Developer ID Application: <name> (<TEAMID>)'"
            exit 1
          fi
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM_ID"   >> "$GITHUB_OUTPUT"

      - name: Write Notary API Key
        id: notary
        env:
          KEY_BASE64: ${{ secrets.DEVTOOLS_APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$KEY_BASE64" ] || { echo "::error::DEVTOOLS_APPLE_API_KEY_BASE64 is empty"; exit 1; }
          KEY="$RUNNER_TEMP/notary-key.p8"
          ( umask 077; printf '%s' "$KEY_BASE64" | base64 --decode > "$KEY" )
          grep -q 'BEGIN PRIVATE KEY' "$KEY" \
            || { echo "::error::DEVTOOLS_APPLE_API_KEY_BASE64 does not decode to a .p8 private key"; exit 1; }
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Sign And Notarize
        env:
          SIGN_IDENTITY: ${{ secrets.DEVTOOLS_APPLE_SIGNING_IDENTITY }}
          SIGN_KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          EXPECT_TEAM_ID: ${{ steps.keychain.outputs.team_id }}
          NOTARY_KEY_FILE: ${{ steps.notary.outputs.key }}
          NOTARY_KEY_ID: ${{ secrets.DEVTOOLS_APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.DEVTOOLS_APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(_in/*.tar.gz)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "::error::Artifact ${{ matrix.artifact }} holds no .tar.gz"
            exit 1
          fi
          for pkg in "${pkgs[@]}"; do
            bash tools/release/sign_macos_package.sh "$pkg" _out
          done

      - name: Replace Package Artifact With The Signed One
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: _out/*.tar.gz
          overwrite: true
          if-no-files-found: error

      - name: Remove Keychain And Key
        if: always()
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        run: |
          [ -z "$KEYCHAIN" ] || security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/cert.p12"

    outputs:
      team_id: ${{ steps.keychain.outputs.team_id }}

  # Written only when every package was signed, so its presence means "this
  # run's macOS packages are signed", which Verify Packages then enforces.
  # Matched by name, like Verify Packages' own marker.
  record:
    needs: sign
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Write Marker
        env:
          ARTIFACTS: ${{ inputs.artifacts }}
          TEAM_ID: ${{ needs.sign.outputs.team_id }}
        run: |
          set -euo pipefail
          [ -n "$TEAM_ID" ] || { echo "::error::no Team ID from the sign job"; exit 1; }
          { echo "team_id=$TEAM_ID"; echo "artifacts=$ARTIFACTS"; } | tee signed.txt

      - name: Upload Marker
        uses: actions/upload-artifact@v7
        with:
          name: macos-signed-${{ needs.sign.outputs.team_id }}
          path: signed.txt
          retention-days: 90
          if-no-files-found: error
